flight:
  # Per-station telemetry older than this is unsafe to apply.
  stale-after-millis: 1000

registration:
  # Station bridges contact this private-LAN UDP listener. Never expose it
  # through Playit or a public firewall rule.
  bind-host: "0.0.0.0"
  port: 12101
  heartbeat-interval-millis: 1000
  subscription-expiry-seconds: 3.0
  socket-timeout-millis: 200
  station-ttl-millis: 5000
  max-stations: 16

movement:
  blocks-per-meter: 1.0
  heading-offset-degrees: 0.0
  max-step-blocks: 20.0
