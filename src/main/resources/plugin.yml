name: JumpMinecraft
version: '${version}'
main: com.jump.minecraft.JumpMinecraftPlugin
api-version: '26.3'
description: Position-authoritative multi-station bridge from JUMP FLIGHT to Minecraft.
authors: [JUMP]
commands:
  jump:
    description: Inspect or troubleshoot JUMP station assignments.
    usage: /jump <status|stations|assign <station> <player>|arm [player]|mode <player> <minecraft|flight|desktop>|disarm [station]>
    permission: jump.control
permissions:
  jump.control:
    description: Controls the JUMP flight bridge.
    default: op
